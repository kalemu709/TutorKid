<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Practice</title>
<style>
:root{--ink:#17352f;--muted:#72817b;--paper:#f8f7f2;--green:#176c52;--mint:#e3f2e9;--line:#dce4dd;--orange:#d77945}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1480px;margin:auto;padding:28px 30px 55px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;display:grid;place-items:center;border-radius:15px;background:#dceee3;color:var(--green);font:26px/1 serif}.brand h1{font-size:19px;margin:0;letter-spacing:-.02em}.brand p{font-size:12px;color:var(--muted);margin:1px 0 0}.voice-status{font-size:11px;color:var(--muted);text-align:right;margin:-12px 0 17px}.local{font-size:12px;color:#547064;background:#e8eee8;border-radius:30px;padding:7px 11px}.layout{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:24px;align-items:start}.layout>aside{position:sticky;top:20px}.card{border:1px solid var(--line);background:#fffefa;border-radius:19px;padding:21px;box-shadow:0 7px 22px #25493608;min-width:0}.card h2{font-size:16px;margin:0 0 5px}.sub{font-size:13px;color:var(--muted);margin:0 0 17px}.field{margin:13px 0}.field label{display:block;font-weight:600;font-size:13px;margin-bottom:7px}input[type=file],textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px;color:var(--ink);font:inherit;font-size:13px}textarea{height:98px;resize:vertical}button{border:0;border-radius:11px;padding:11px 15px;background:var(--green);color:white;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;transition:.15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:disabled{opacity:.42;cursor:not-allowed;transform:none}.secondary{background:#edf3ef;color:var(--ink)}.quiet{background:transparent;color:var(--green);padding:8px}.wide{width:100%}.or{font-size:11px;color:#98a39d;text-align:center;margin:9px}.note{font-size:11px;color:var(--muted);margin:12px 0 0}.status{font-size:12px;color:var(--green);min-height:20px;margin-top:10px}.practice{min-height:calc(100vh - 145px);padding:25px 30px;display:flex;flex-direction:column}.practice-head{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.progress{height:6px;background:#ecf0ec;border-radius:6px;margin:13px 0 20px;overflow:hidden}.bar{height:100%;width:0;background:#69a986;border-radius:6px;transition:width .3s}.prompt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px}.shortcut-hint{font-size:11px;color:var(--muted);text-align:right;margin:-12px 0 10px}.shortcut-hint kbd{display:inline-block;min-width:18px;padding:1px 4px;border:1px solid var(--line);border-radius:4px;background:#fffefa;color:#52675e;text-align:center;font:600 10px ui-monospace,monospace}.ai-status{min-height:18px;margin-top:4px;font-size:12px;color:#547064;text-align:center}.cue{font-size:13px;color:var(--muted);margin:0 0 8px}.character{font:112px/1.25 "Songti SC","Noto Serif CJK SC",serif;min-height:140px;color:var(--ink)}.character.hidden{visibility:hidden;user-select:none}.example{min-height:27px;height:auto;max-width:760px;white-space:pre-line;text-align:center;line-height:1.65;color:#4d7d67;font-size:15px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.writebox{border-top:1px solid var(--line);padding-top:16px}.writehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.writehead strong{font-size:13px}.writehead span{font-size:11px;color:var(--muted)}canvas{width:100%;height:173px;background-color:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;background-image:linear-gradient(90deg,transparent calc(50% - .5px),#e5ebe6 50%,transparent calc(50% + .5px)),linear-gradient(transparent calc(50% - .5px),#e5ebe6 50%,transparent calc(50% + .5px));cursor:crosshair}.writebuttons{display:flex;justify-content:space-between;align-items:center;margin-top:11px}.rightbuttons{display:flex;gap:8px}.empty{color:var(--muted);font-size:14px;text-align:center;max-width:330px;line-height:1.7}.done{font-size:24px;font-family:serif;color:var(--green)}.tabs{display:flex;gap:5px;padding:4px;background:#f0f4f0;border-radius:12px;margin-bottom:18px}.tab{flex:1;padding:9px 7px;background:transparent;color:#60746b;font-size:13px}.tab.active{background:#fffefa;color:var(--green);box-shadow:0 1px 5px #29453212}.pane.hidden{display:none}.review-count{font-size:13px;color:var(--muted);margin:5px 0 14px}.review-list{display:flex;flex-wrap:wrap;gap:7px;min-height:38px;margin:12px 0 17px}.review-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 7px 5px 10px;border-radius:18px;background:#eaf4ed;color:var(--ink);font:21px serif}.review-chip button{padding:0 3px;background:transparent;color:#71837a;font-size:15px}.review-empty{font-size:13px;color:var(--muted);padding:8px 0}.save-btn{background:#fff3e7;color:#97512b}.save-btn.saved{background:#edf3ef;color:var(--green)}.tip{background:#f2f7f2;padding:10px 13px;border-radius:11px;color:#53705e;font-size:12px;margin-top:14px}
@media(max-width:980px){.shell{padding:18px 16px 35px}.layout{grid-template-columns:1fr}.layout>aside{position:static}.practice{min-height:620px}.top{margin-bottom:16px}.local{font-size:10px}.card{padding:17px}.character{font-size:86px}}
</style>
<style>
.character-row{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:140px}
.character-row .character{margin:0}
.character-nav{position:absolute;left:calc(50% + 70px);display:flex;flex-direction:column;gap:8px}
.character-nav-button{width:40px;height:40px;padding:0;border-radius:12px;font-size:19px;line-height:1}
@media(max-width:980px){.character-nav{left:calc(50% + 54px)}}
.character-nav{left:auto;right:0}
.actions{justify-content:space-between;width:100%}
.chars-hidden{display:flex;align-items:center;justify-content:center;text-align:center;height:98px;border:1px dashed var(--line);border-radius:11px;background:#f6f8f5;padding:11px;color:var(--muted);font-size:13px}
</style>
</head>
<body><div id="root"></div><script src="/app.js"></script></body></html>
