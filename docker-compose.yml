services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutorkid
      POSTGRES_PASSWORD: tutorkid
      POSTGRES_DB: tutorkid
    ports:
      - "54329:5432"
    volumes:
      - tutorkid_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorkid -d tutorkid"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    # Same load order as scripts/lib.sh `load_env dev` — see env/README.md
    env_file:
      - env/common.env
      - env/dev.env
      - path: env/local.env
        required: false
    environment:
      PORT: "8080"
      # Inside Compose the DB hostname is `db`, not localhost.
      DATABASE_URL: postgresql://tutorkid:tutorkid@db:5432/tutorkid
    depends_on:
      db:
        condition: service_healthy

volumes:
  tutorkid_pg:
